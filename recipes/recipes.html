<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Recipe search application.">
    <meta name="author" content="Joshua Jones">          
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link href="recipes.css" rel="stylesheet" >
    <script src="recipes.js" defer></script>

    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Dynamic Recipe Search Engine">
    <meta property="og:image" content="images/social-preview-image.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">     
</head>

<body>
    <header class="site-header">
        <img class="recipe-book" src="images/recipe-book.png" alt="RecipeBook logo">
        <h1>RECIPEBOOK</h1>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Find a recipe" aria-label="Search">
        <button id="searchButton" type="button" class="search-btn">
            <img src="images/search.svg" class="search-btn-img" alt="Search Icon">
        </button>
    </div>

    <hr>

    <main>
        <div id="recipe-container"></div>
    </main>
                    
    <footer>
        <a class="flaticon-link-2" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
    </footer>
</body>
</html>
