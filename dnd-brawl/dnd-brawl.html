<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dnd Brawl</title>
    <meta name="description" content="A Character Card that has stats allowing the user to either attack or attempt to recruit the character on the card">
    <meta name="author" content="Joshua Seth Jones">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="" type="image/png">
    <link rel="preload" href="fonts/Bookinsanity.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="fonts/BookinsanityBoldItalic.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="dnd-brawl.css">
    <script src="dnd-brawl.js" defer></script>
</head>

<body>
    
    <div class="userHPContainer">
        <h2 class="userStats">User HP: <span id="userHealth">200</span></h2>
    </div>
    <div class="potionBar">
        <h3 class="potionInventory">Potions: </h3>
        <span id="potionCount" alt='health potion image'></span>
    </div>
    <div class="card">
        
        <img class="image" src="images/valeros_fighter.png" alt="Character Image" width="400" height="400">
        
        <h1 class="name">Valeros Stormwind</h1>
        
        <div class="stats">
            <p class="stat1">Class: <span id="adventurer-class"> Fighter</span></p>
            <p class="stat2">Level: <span id="level"> 1</span></p>
            <p class="stat3">Health: <span id="health"> 100</span></p>
        </div>
        
        <div class="buttons">
            <button id="attack-btn">Attack</button>
            <button id="potion-btn">Use Potion</button>
            <button id="recruit-btn">Attempt Recruitment</button>
        </div>
        <div class="buttons">
        </div>
    </div>
    <div class="allyInventory">
        <p class="userStats">Ally Inventory</h3>
        <div class="allies">

        </div>
    </div>
</body>
</html>
